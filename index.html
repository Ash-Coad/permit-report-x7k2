od exceeding 6 months will be voided. Projects with no review activity for a period exceeding 6 months will be voided. REVISIONS NOTE: Please send your revised plans back as an attached PDF. Due to the security risks associated with clicking external links revised plans must be in PDF format attached directly to the resubmittal e-mail. A written response to review comments is also required with each resubmission. (If the revised plan set is too large for one e-mail, it should be broken up as necessary and sent via multiple e-mails with a note explaining that more than one e-mail is being sent.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Building Inspections (Steven Parks) disapproved; demolition forms must be redone by the new contractor (owner).","fixes":[{"key":"a0ba1864a2e6","text":"Provide all 3 demolition permit forms filled out and signed by the new contractor (owner), replacing those signed by the previous contractor."},{"key":"c8e9240b0396","text":"Email revisions as attached PDFs only to SMALLPROJECTREVIEW@DURHAMNC.GOV with subject line \"SP PERMIT #: 26103609\"; do not use D-Plans."},{"key":"014bbd7a2e83","text":"Include a written response to the review comments with the resubmission."}]},"actionable":true,"discipline":"Architect / structural engineer"},{"uid":"p-1704-sprunt-ave-26103020:ca54938c8d4f7aa08d18a4d078204abc","permit_uid":"p-1704-sprunt-ave-26103020","property":"1704 Sprunt Ave","jurisdiction":"Durham","dept":"Building Inspections","reviewer_status":"Approved","city_date":"June 29, 2026 8:29 AM","city_date_iso":"2026-06-29","text":"Building Permit Application #: 26103020 Reviewed by Steven Parks, APPROVED on Date 6/29/26","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Building Inspections reviewer Steven Parks approved building permit application #26103020 on 6/29/26.","fixes":[]},"actionable":false,"discipline":"Architect / structural engineer"},{"uid":"p-1704-sprunt-ave-26103020:7b051a8ab2a4c106aace65a3b81365f6","permit_uid":"p-1704-sprunt-ave-26103020","property":"1704 Sprunt Ave","jurisdiction":"Durham","dept":"Final","reviewer_status":"Approved","city_date":"June 29, 2026 12:07 PM","city_date_iso":"2026-06-29","text":"PG","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Final review approved by reviewer PG; no action needed.","fixes":[]},"actionable":false,"discipline":null},{"uid":"p-801-colonial-26104367:5b086b6d5a2e8ced30594d594e19d5ba","permit_uid":"p-801-colonial-26104367","property":"801 Colonial","jurisdiction":"Durham","dept":"Building Inspections","reviewer_status":"Approved","city_date":"September 29, 2026 5:16 PM","city_date_iso":"2026-09-29","text":"Building Permit Application #: 26104367 Reviewed by Kim Jennings, APPROVED 09/29/2026","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Building Inspections (Kim Jennings) approved building permit application 26104367 on 09/29/2026.","fixes":[]},"actionable":false,"discipline":"Architect / structural engineer"},{"uid":"p-801-colonial-26104367:0e70e584495d66beaef9990edf8bf6b4","permit_uid":"p-801-colonial-26104367","property":"801 Colonial","jurisdiction":"Durham","dept":"Public Works - Engineering Development Review","reviewer_status":"Comments","city_date":"October 1, 2026 4:54 PM","city_date_iso":"2026-10-01","text":"1. Within the public right-of-way (ROW), align the driveway perpendicular to the ROW in accordance with the City's driveway ordinance. This alignment may require a new curb cut constructed to City standards instead of using the existing curb cut. Maintain at least 3 feet of separation between the edge of the driveway flare/turnout and the existing utility pole. If this separation cannot be achieved, consider a shared driveway with the adjacent property to the north of the flag lot's access strip, subject to obtaining a recorded private access easement. 2. Provide at least 3 feet of clearance between the southern edge of the driveway and the adjacent property line along the flag lot's access strip to accommodate the water meter installation out of the driveway. Maintain a minimum driveway width of 9 feet. 3. The sanitary sewer cleanout may be located within the driveway; however, it must be traffic-bearing and labeled accordingly on the plan. Note: Email the revised plot plan to Md.Hadiuzzaman@durhamnc.gov and include the building permit number in the subject line of the email.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Public Works Engineering requires driveway, water meter clearance, and sewer cleanout revisions on the plot plan.","fixes":[{"key":"7c2cc83988f4","text":"Align the driveway perpendicular to the ROW per the City driveway ordinance, possibly with a new curb cut built to City standards."},{"key":"56cd492c8c87","text":"Keep at least 3 feet between the driveway flare/turnout and the existing utility pole, or consider a shared driveway with a recorded private access easement."},{"key":"0de7ed2c28b0","text":"Provide at least 3 feet between the driveway's southern edge and the adjacent property line along the access strip for the water meter, keeping the driveway at least 9 feet wide."},{"key":"a5ab4bfd8eaa","text":"If the sanitary sewer cleanout is in the driveway, make it traffic-bearing and label it so on the plan."},{"key":"e90decf189d9","text":"Email the revised plot plan to Md.Hadiuzzaman@durhamnc.gov with the building permit number in the subject line."}]},"actionable":true,"discipline":"Civil engineer"},{"uid":"p-801-colonial-26104367:76a56c45bd0947f66ab1aa7899798aa2","permit_uid":"p-801-colonial-26104367","property":"801 Colonial","jurisdiction":"Durham","dept":"Public Works - Transportation","reviewer_status":"Approved","city_date":"October 13, 2026 12:09 PM","city_date_iso":"2026-10-13","text":"Public Works - Transportation: Approved","resolved_by_city":false,"listed":true,"first_seen":"2026-10-13T15:02:30-04:00","ai":{"source":"ai","needs_action":false,"summary":"Public Works Transportation approved the permit.","fixes":[]},"actionable":false,"discipline":"Civil engineer"},{"uid":"p-801-colonial-26104367:a2ad386bd6b19fc6dc098be97baef16d","permit_uid":"p-801-colonial-26104367","property":"801 Colonial","jurisdiction":"Durham","dept":"Planning Department","reviewer_status":"Disapproved","city_date":"September 29, 2026 9:50 AM","city_date_iso":"2026-09-29","text":"Permit application number: 26104367 Reviewed by Shawnee Thompson 9/29/26, Disapproved. Send revisions or inquiries to permitplanners@durhamnc.gov. In the email subject line, please include the above referenced permit number and ATTN to Shawnee Thompson 1. ? Per UDO 8.7.2.B <https://udo.durhamnc.gov/udo/8_07_Watershed%20Protection%20Overlay_1.htm>, the proposed development is subject to impervious surface limitations. The maximum impervious surface allotted for this lot of record is 2098 square feet. Please provide on the plot plan all existing and proposed impervious surface square footages to demonstrate compliance with this limitation.? The plat shows an existing impervious area of 1000 sq ft. 2. Per UDO section 7.1.2.C.4 <https://udo.durhamnc.gov/udo/7_01_Housing%20Types.htm>, in addition to the required street tree requirements, at least one canopy AND one understory tree shall be planted or retained on the lot. Please show the lot trees, species, root diameter, and calipers on your plot plan. In order to ensure it is an acceptable tree coverage species, please refer to 'Durhams Landscape Manual <https://www.durhamnc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=>. 2a. ?In order to get credit for a crape myrtle as a canopy tree, add a note on plans NOT to prune leaders, head back, or otherwise reduce height, and specify single-stem or maximum of 3-5 stems, if multi-stemmed. 2b. Please show the minimum root areas required around the street tree and lot tree. These root areas may not interfere with any structures foundation. 3. Per UDO section 6.12.3.B.11 <https://udo.durhamnc.gov/udo/6_12_Measurement%20and%20Computation.htm>, HVAC units may extend into any required side and rear yard, but must remain 3 feet from the property line. Please show the HVAC unit and distances to the side and rear property lines on your plot plan. 4. Per UDO section 7.1.2.C.3 <https://udo.durhamnc.gov/udo/7_01_Housing%20Types.htm>, the maximum above grade heated square footage of a primary dwelling shall be 1200 square feet with the maximum building footprint of 800 square feet. Please show both the above grade heated square footage and the building footprint square footage on the plot plan. 5. Please show on the plot plan?how you meet the sustainability requirement as defined in UDO section 7.1.2.C.4.c 6. Per UDO section 6.8.3.D <https://udo.durhamnc.gov/udo/6_08_Infill%20Development%20in%20Residential.htm>, for sites where no other stormwater control measures? are required, downspouts shall direct stormwater runoff over pervious areas and shall not be piped to right-of-way. Please show on the plot plan how this standard will be met. A note on the plot plan will be sufficient.? Advisory Comment: Although GIS does not show the existing alley as improved and maintained, please be aware that when an alley is improved and maintained, flag lots require all motor vehicle access to be taken only from the alley. Advisory Comment: The Planning & Development Department has received several messages about application fee scams. The Planning & Development Department does not send invoices or bills. All payments for Planning & Development fees should be paid through the Paymentus portal found at <https://ipn2.paymentus.com/rotp/dhds>. The Planning & Development Department will never ask for a wire transfer.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Planning (Shawnee Thompson) disapproved the permit; plot plan must show impervious, tree, HVAC, size, sustainability, and downspout compliance.","fixes":[{"key":"eb1905ab2747","text":"Show all existing (plat shows 1000 sq ft) and proposed impervious surface on the plot plan, proving compliance with the 2098 sq ft maximum per UDO 8.7.2.B."},{"key":"59addd8c661d","text":"Show at least one canopy and one understory lot tree with species, root diameter, and calipers per UDO 7.1.2.C.4 and Durham's Landscape Manual."},{"key":"03ecd5742d76","text":"For crape myrtle canopy credit, note not to prune leaders, head back, or reduce height, and specify single-stem or 3-5 stems maximum."},{"key":"fa25c7af1e54","text":"Show minimum root areas around the street tree and lot tree, kept clear of any structure foundation."},{"key":"6cf3271ff072","text":"Show the HVAC unit and its distances to side and rear property lines, keeping at least 3 feet away per UDO 6.12.3.B.11."},{"key":"0f4efd144e7e","text":"Show above-grade heated square footage (max 1200 sq ft) and building footprint (max 800 sq ft) per UDO 7.1.2.C.3."},{"key":"1792dd627426","text":"Show on the plot plan how the sustainability requirement of UDO 7.1.2.C.4.c is met."},{"key":"2a6dd0bf74b4","text":"Add a plot plan note that downspouts direct runoff over pervious areas and are not piped to the right-of-way per UDO 6.8.3.D."},{"key":"1bd9334de64a","text":"Email revisions to permitplanners@durhamnc.gov with permit number 26104367 and ATTN Shawnee Thompson in the subject line."}]},"actionable":true,"discipline":"Land planner / civil engineer"},{"uid":"p-801-colonial-26104368:89352258ebc6607a2ea648e358d9a9a7","permit_uid":"p-801-colonial-26104368","property":"801 Colonial","jurisdiction":"Durham","dept":"Building Inspections","reviewer_status":"Disapproved","city_date":"September 29, 2026 5:48 PM","city_date_iso":"2026-09-29","text":"Building Permit Application #: 26104368 Reviewed by Kim Jennings, DISAPPROVED on Date 09/29/2026 - Send revisions to: SMALLPROJECTREVIEW@DURHAMNC.GOV <mailto:SMALLPROJECTREVIEW@DURHAMNC.GOV> only. In the email subject line, please include only: KJ PERMIT #: 26104368 Do not submit revisions through D-Plans. When applicable, submit only revised sheets. Please address the following comments: 1) Affidavit of Worker's Compensation Coverage document is not signed/dated. Please sign and date. NOTE: A re-review will be necessary upon receipt of your reply. Please be aware your responses may generate additional comments / a $200 re-review fee may be charged for repeated FAILED RE-REVIEWS. If applied, this will be noted at front of comments / Please note: Applications are valid for six months, applications with no response or review activity for a period exceeding 6 months will be voided. Projects with no review activity for a period exceeding 6 months will be voided. REVISIONS NOTE: Please send your revised plans back as an attached PDF. Due to the security risks associated with clicking external links revised plans must be in PDF format attached directly to the resubmittal e-mail. A written response to review comments is also required with each resubmission. (If the revised plan set is too large for one e-mail, it should be broken up as necessary and sent via multiple e-mails with a note explaining that more than one e-mail is being sent.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Building Inspections (Kim Jennings) disapproved; the workers' compensation affidavit must be signed and dated.","fixes":[{"key":"f9bfdc232e18","text":"Sign and date the Affidavit of Worker's Compensation Coverage."},{"key":"4fbd19fc7d8c","text":"Email the revised PDF and a written response to SMALLPROJECTREVIEW@DURHAMNC.GOV with subject \"KJ PERMIT #: 26104368\"; do not use D-Plans."}]},"actionable":true,"discipline":"Architect / structural engineer"},{"uid":"p-801-colonial-26104368:415ca84a494446963982429a585ac509","permit_uid":"p-801-colonial-26104368","property":"801 Colonial","jurisdiction":"Durham","dept":"Public Works - Engineering Development Review","reviewer_status":"Comments","city_date":"October 1, 2026 5:10 PM","city_date_iso":"2026-10-01","text":"1. Within the public right-of-way (ROW), align the driveway perpendicular to the ROW in accordance with the City's driveway ordinance. This alignment may require a new curb cut constructed to City standards instead of using the existing curb cut. Maintain at least 3 feet of separation between the edge of the driveway flare/turnout and the existing utility pole. 2. Show and label the existing utility poles and the type of curb & gutter. 3. Required minimum driveway width is 9 feet. Note: Email the revised plot plan to Md.Hadiuzzaman@durhamnc.gov and include the building permit number in the subject line of the email.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Public Works Engineering requires driveway, utility pole and curb revisions on the plot plan.","fixes":[{"key":"f17583cf8eaf","text":"Align the driveway perpendicular to the ROW per the City driveway ordinance, adding a new curb cut to City standards if needed."},{"key":"df4733611496","text":"Keep at least 3 feet between the driveway flare/turnout edge and the existing utility pole."},{"key":"58a31633ace4","text":"Show and label the existing utility poles and the type of curb and gutter."},{"key":"e49429839619","text":"Provide a minimum driveway width of 9 feet."},{"key":"df2390173156","text":"Email the revised plot plan to Md.Hadiuzzaman@durhamnc.gov with the building permit number in the subject line."}]},"actionable":true,"discipline":"Civil engineer"},{"uid":"p-801- nc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=>. 2a. ?In order to get credit for a crape myrtle as a canopy tree, add a note on plans NOT to prune leaders, head back, or otherwise reduce height, and specify single-stem or maximum of 3-5 stems, if multi-stemmed. 2b. Please show the minimum root areas required around the street trees and lot tree. These root areas may not interfere with any structures foundation. 4. Per UDO section 7.1.2.C.3 <https://udo.durhamnc.gov/udo/7_01_Housing%20Types.htm>, the maximum above grade heated square footage of a primary dwelling shall be 1200 square feet with the maximum building footprint of 800 square feet. Please show both the above grade heated square footage and the building footprint square footage on the plot plan. 5. Please show on the plot plan?how you meet the sustainability requirement as defined in UDO section 7.1.2.C.4.c 6. Per UDO section 6.8.3.D <https://udo.durhamnc.gov/udo/6_08_Infill%20Development%20in%20Residential.htm>, for sites where no other stormwater control measures? are required, downspouts shall direct stormwater runoff over pervious areas and shall not be piped to right-of-way. Please show on the plot plan how this standard will be met. A note on the plot plan will be sufficient.? 7. Parking should meet the minimum requirements found in UDO section 6.8.4 <https://udo.durhamnc.gov/udo/6_08_Infill%20Development%20in%20Residential.htm> Please demonstrate on the plot plan how these standards are met by providing the location, length, and width of the proposed vehicular use area.? Advisory Comment: Although GIS does not show the existing alley as improved and maintained, please be aware that when an alley is improved and maintained, flag lots require all motor vehicle access to be taken only from the alley. Advisory Comment: The Planning & Development Department has received several messages about application fee scams. The Planning & Development Department does not send invoices or bills. All payments for Planning & Development fees should be paid through the Paymentus portal found at <https://ipn2.paymentus.com/rotp/dhds>. The Planning & Development Department will never ask for a wire transfer.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Planning (Shawnee Thompson) disapproved; the plot plan needs impervious, tree, size, sustainability, stormwater and parking details.","fixes":[{"key":"12a4961238ea","text":"Show all existing (212 sq ft per plat) and proposed impervious square footage, demonstrating compliance with the 1685 sq ft maximum per UDO 8.7.2.B."},{"key":"ed37dce18793","text":"Show at least one canopy and one understory lot tree with species, root diameter and calipers per UDO 7.1.2.C.4 and the Landscape Manual."},{"key":"c339827c3cdd","text":"For crape myrtle canopy credit, note no pruning of leaders, heading back or height reduction; specify single-stem or max 3-5 stems."},{"key":"7191a8267064","text":"Show minimum root areas around street trees and lot tree, not interfering with any structure foundation."},{"key":"2015371f2352","text":"Show above-grade heated square footage (max 1200 sq ft) and building footprint (max 800 sq ft) per UDO 7.1.2.C.3."},{"key":"e6e4e41a11d2","text":"Show how the sustainability requirement of UDO 7.1.2.C.4.c is met."},{"key":"8e26e6669121","text":"Add a note that downspouts direct runoff over pervious areas, not piped to the right-of-way, per UDO 6.8.3.D."},{"key":"5bb56cd1d058","text":"Show location, length and width of the proposed vehicular use area meeting UDO 6.8.4 parking requirements."},{"key":"05b989f201c8","text":"Email revisions to permitplanners@durhamnc.gov with permit number 26104368 and \"ATTN Shawnee Thompson\" in the subject."}]},"actionable":true,"discipline":"Land planner / civil engineer"},{"uid":"p-801-colonial-26104368:0696d5d4d3d23633d9049aa6d06b36bf","permit_uid":"p-801-colonial-26104368","property":"801 C ng details are required.","fixes":[{"key":"668346cc43ff","text":"Show basement waterproofing and details; email revised sheets to PLANSREVIEW@DURHAMNC.GOV with subject 'PERMIT #: 26102070 CCJ', not via D-Plans."}]},"actionable":true,"discipline":"Architect / structural engineer"},{"uid":"p-1009-washington-26102070:ebc2f90f864b90167662a5cf9e3ca410","permit_uid":"p-1009-washington-26102070","property":"1009 Washington","jurisdiction":"Durham","dept":"Public Works - Engineering Development Review","reviewer_status":"Disapproved","city_date":"May 5, 2026 9:02 PM","city_date_iso":"2026-05-05","text":"1. On the plot plan, show/label the length of the existing retaining wall to be demolished. A new retaining wall will be required on the south side of the proposed driveway, perpendicular to the existing wall. Show/label it. 2. Show/label the existing sidewalk on the plot plan. 3. Show/label the existing utility pole and guy wire the distance from the proposed driveway. 4. There is a large oak tree that appears to conflict with the proposed development. Show/label it to be removed, or please advise. Email the revised plot plan and cap fees receipt to Edward.Francis@durhamnc.gov and include the building permit number in the subject line of the email.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Public Works Engineering disapproved; plot plan needs retaining walls, sidewalk, utility pole, and oak tree shown.","fixes":[{"key":"767bfc538ac2","text":"Show/label the length of the existing retaining wall to be demolished on the plot plan."},{"key":"f4acf8ffc575","text":"Show/label a new retaining wall on the south side of the proposed driveway, perpendicular to the existing wall."},{"key":"56bc20ae76bd","text":"Show/label the existing sidewalk on the plot plan."},{"key":"1259264e599b","text":"Show/label the existing utility pole and guy wire with distance from the proposed driveway."},{"key":"b40a0c38e1b5","text":"Show/label the large conflicting oak tree as removed, or advise the reviewer."},{"key":"37879cb175d4","text":"Email revised plot plan and cap fees receipt to Edward.Francis@durhamnc.gov with the building permit number in the subject."}]},"actionable":true,"discipline":"Civil engineer"},{"uid":"p-1009-washington-26102070:35b28270024abfb1e5fc37f8b09f67da","permit_uid":"p-1009-washington-26102070","property":"1009 Washington","jurisdiction":"Durham","dept":"Public Works - Transportation","reviewer_status":"Approved","city_date":"May 6, 2026 1:09 PM","city_date_iso":"2026-05-06","text":"Public Works - Transportation: Approved","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Public Works Transportation approved the permit.","fixes":[]},"actionable":false,"discipline":"Civil engineer"},{"uid":"p-1009-washington-26102070:cf5a505c4866103908e1b372038b55fe","permit_uid":"p-1009-washington-26102070","property":"1009 Washington","jurisdiction":"Durham","dept":"Planning Department","reviewer_status":"Disapproved","city_date":"May 11, 2026 2:17 PM","city_date_iso":"2026-05-11","text":"Permit application number: 26102070. Reviewed by Keagan Sacripanti, 5/11/2026, Disapproved. Send revisions or inquiries to: Keagan.Sacripanti@durhamnc.gov. In the email subject line, please include only the permit application number. Please do not submit revisions or inquiries via Dplans or the Box upload portal. Please address the following: 1. This lot is subject to infill restrictions per UDO section 6.8. Please complete the following revisions or provide the following information in order to establish conformity with infill development standards. 1a. Please revise infill data to include height of adjacent primary structure at 400 Macon St. Per UDO 6.8.3B.2, the proposed structure shall not exceed the height of the adjacent structure by more than 14 feet. 1b. Per UDO 6.8.3D, please revise plans to show downspouts directing stormwater runoff over pervious area and not piped to right-of-way. 1c. Per UDO 6.8.4, vehicular use area width shall not exceed 12 feet in front of the front building line. Please revise vehicular use area dimensions. 2. Please complete the following revisions or provide the following information in order to establish conformity with Small Lot Option development standards per UDO 7.1.2C. 2a. Please revise below grade calculations to list average finished ground level computed per UDO 6.12.1A.1 and specify percentage of ground floor below average grade, in order to establish exclusion from story height and square footage limits per UDO 7.1.2C.2-3. 2b. Per UDO 7.1.2C.4.a, in addition to the required street tree, at least one canopy and one understory tree shall be planted or preserved on the lot. Please revise plot plan to identify both required lot trees. 3. Please provide the specific species/cultivar of crape myrtle from the Durham Landscaping Manual <https://www.durhamnc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=> in order to establish that proposed crape myrtles are allowable for street tree use in the Urban tier. 4. Per UDO 7.9.1B, 5' grading setback shall be undisturbed except where consistent with UDO 7.9.1C. Please revise plot plan and plans to remove retaining wall within grading buffer or specify UDO basis for disturbance within the grading setback. // A re-review will be necessary upon receipt of your reply. Please note: Applications are valid for six months, applications with no response or review activity for a period exceeding 6 months will be voided. The current turnaround period for planning review on building permits is 5 business days.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Planning (Keagan Sacripanti) disapproved 5/11/2026 over infill, small lot, street tree, and grading setback issues.","fixes":[{"key":"1798596d3ac7","text":"Add height of adjacent structure at 400 Macon St to infill data; proposed may not exceed it by over 14 feet (UDO 6.8.3B.2)."},{"key":"db11a517cdf8","text":"Show downspouts directing runoff over pervious area, not piped to right-of-way (UDO 6.8.3D)."},{"key":"35150f2863fe","text":"Revise vehicular use area so width does not exceed 12 feet in front of the front building line (UDO 6.8.4)."},{"key":"4fcf3a62d780","text":"Revise below-grade calculations to list average finished ground level (UDO 6.12.1A.1) and percentage of ground floor below grade (UDO 7.1.2C.2-3)."},{"key":"2fe706722e38","text":"Identify one canopy and one understory lot tree on the plot plan, besides the street tree (UDO 7.1.2C.4.a)."},{"key":"dd9ad87b0429","text":"Specify crape myrtle species/cultivar from the Durham Landscape Manual allowable for Urban tier street trees."},{"key":"73ee9c4b4c83","text":"Remove retaining wall from 5' grading setback or cite UDO 7.9.1C basis for disturbance."},{"key":"7cefea8bb162","text":"Email revisions to Keagan.Sacripanti@durhamnc.gov with only the permit number in the subject."}]},"actionable":true,"discipline":"Land planner / civil engineer"},{"uid":"p-1009-washington-26102070:dedd98a16156ff8ad35b048ec4c4ba0a","permit_uid":"p-1009-washington-26102070","property":"1009 Washington","jurisdiction":"Durham","dept":"Building Inspections","reviewer_status":"Approved","city_date":"August 12, 2026 2:05 PM","city_date_iso":"2026-08-12","text":"26102070-bldg portion of permit approved by calvin jones","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Building Inspections (Calvin Jones) approved the building portion of the permit.","fixes":[]},"actionable":false,"discipline":"Architect / structural engineer"},{"uid":"p-1009-washington-26102070:449217b4b3ccc73bfa41054bcbdc5d37","permit_uid":"p-1009-washington-26102070","property":"1009 Washington","jurisdiction":"Durham","dept":"Planning Department","reviewer_status":"Disapproved","city_date":"July 20, 2026 8:29 PM","city_date_iso":"2026-07-20","text":"Permit application number: 26102070. Reviewed by Keagan Sacripanti, 7/20/2026, Disapproved. Send revisions or inquiries to: Keagan.Sacripanti@durhamnc.gov. In the email subject line, please include only the permit application number. Please do not submit revisions or inquiries via Dplans or the Box upload portal. Please address the following: 1. REPEAT COMMENT: Per UDO 6.8.4, vehicular use area width shall not exceed 12 feet in front of the front building line. Please revise vehicular use area dimensions. (NOTE PER APPLICANT REVISION: Required width shall be maintained for all vehicular use areas. Revise paving to separate driveways and walkway as applicable.) 2. REPEAT COMMENT [LANGUAGE REVISED FOR CLARITY]: Per UDO 7.1.2C.2, building height shall not exceed two stories. Proposed building height is three stories per computation method in UDO 6.12.1/17.3. Revise building height. 3. NEW COMMENT PER APPLICANT REVISION: Provided below-grade calculations indicating that the entire ground level is below 350.25' elevation are inconsistent with provided building elevations showing substantial portions of the ground level exposed/above average grade. Please revise below-grade calculations for consistency with building elevations. 4. PARTIAL REPEAT COMMENT: Please provide the specific cultivar of crape myrtle from the Durham Landscaping Manual <https://www.durhamnc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=> in order to establish that proposed crape myrtles are allowable for street tree use in the Urban tier. 5. PARTIAL REPEAT COMMENT/NEW COMMENT PER APPLICANT RESPONSE: Provide revegetation plan for grading within required setbacks per UDO 7.9.1. // A re-review will be necessary upon receipt of your reply. Please note: Applications are valid for six months, applications with no response or review activity for a period exceeding 6 months wi rks - Transportation: Approved","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":false,"summary":"Public Works Transportation approved the permit.","fixes":[]},"actionable":false,"discipline":"Civil engineer"},{"uid":"p-1011-washington-26102071:3df7029d6f2382779954e533da794594","permit_uid":"p-1011-washington-26102071","property":"1011 Washington","jurisdiction":"Durham","dept":"Planning Department","reviewer_status":"Disapproved","city_date":"May 11, 2026 2:44 PM","city_date_iso":"2026-05-11","text":"Permit application number: 26102071. Reviewed by Keagan Sacripanti, 5/11/2026, Disapproved. Send revisions or inquiries to: Keagan.Sacripanti@durhamnc.gov. In the email subject line, please include only the permit application number. Please do not submit revisions or inquiries via Dplans or the Box upload portal. Please address the following: 1. This lot is subject to infill restrictions per UDO section 6.8. Please complete the following revisions or provide the following information in order to establish conformity with infill development standards. 1a. Please revise infill data to include height of adjacent primary structure at 400 Macon St. Per UDO 6.8.3B.2, the proposed structure shall not exceed the height of the adjacent structure by more than 14 feet. 1b. Per UDO 6.8.3D, please revise plans to show downspouts directing stormwater runoff over pervious area and not piped to right-of-way. 1c. Per UDO 6.8.4, vehicular use area width shall not exceed 12 feet in front of the front building line. Please revise vehicular use area dimensions. 2. Please complete the following revisions or provide the following information in order to establish conformity with Small Lot Option development standards per UDO 7.1.2C. 2a. Please revise below grade calculations to list average finished ground level computed per UDO 6.12.1A.1 and specify percentage of ground floor below average grade, in order to establish exclusion from story height and square footage limits per UDO 7.1.2C.2-3. 2b. Per UDO 7.1.2C.4.a, in addition to the required street tree, at least one canopy and one understory tree shall be planted or preserved on the lot. Please revise plot plan to identify both required lot trees. 3. Please provide the specific species/cultivar of crape myrtle from the Durham Landscaping Manual <https://www.durhamnc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=> in order to establish that proposed crape myrtles are allowable for street tree use in the Urban tier. 4. Per UDO 7.9.1B, 5' grading setback shall be undisturbed except where consistent with UDO 7.9.1C. Depicted grade in building plans is inconsistent with current topographic data for this parcel. Please revise plot plan and plans to show extent of proposed grading to establish listed elevations and specify UDO basis for any disturbance within the grading setback. // A re-review will be necessary upon receipt of your reply. Please note: Applications are valid for six months, applications with no response or review activity for a period exceeding 6 months will be voided. The current turnaround period for planning review on building permits is 5 business days.","resolved_by_city":false,"listed":true,"first_seen":"2026-10-12T10:26:37-04:00","ai":{"source":"ai","needs_action":true,"summary":"Planning reviewer Keagan Sacripanti disapproved; infill, small lot, street tree, and grading setback revisions are required.","fixes":[{"key":"f01d6e58607c","text":"Revise infill data to include height of adjacent structure at 400 Macon St; proposed may not exceed it by over 14 ft (UDO 6.8.3B.2)."},{"key":"dca4c3adf746","text":"Show downspouts directing runoff over pervious area, not piped to right-of-way (UDO 6.8.3D)."},{"key":"ae43299161ae","text":"Revise vehicular use area so width does not exceed 12 ft in front of the front building line (UDO 6.8.4)."},{"key":"5cedf6e2e0c2","text":"Revise below grade calculations listing average l vehicular use areas and revise vehicular use area dimensions to conform to maximum allowable width. 2. NEW COMMENT PER APPLICANT REVISION: Please revise below grade calculations for consistency with grade shown in building elevations. 3. REPEAT COMMENT: Please provide the specific species/cultivar of crape myrtle from the Durham Landscaping Manual <https://www.durhamnc.gov/DocumentCenter/View/1363/Landscape-Manual-PDF?bidId=> in order to establish that proposed crape myrtles are allowable for street tree use in the Urban tier. 4. REPEAT COMMENT: Per UDO 7.9.1B, 5' grading setback shall be undisturbed except where consistent with UDO 7.9.1C. Depicted grade in building plans is inconsistent with current topographic data for this parcel. Please revise plot plan and plans to show extent of proposed grading to establish listed elevations and specify UDO basis for any disturbance within the grading setback. NOTES PER APPLICANT REVISION: 4a. June 2026 aerial photographs available in Durham Maps depict grading within the required grading setback. If grading has already been completed within the required grading setback, provide revegetation plan per UDO 9.5.3; revegetation plan shall be reviewed and approved prior to Planning approval of the building permit. It shall not be sufficient to include a note indicating that revegetation shall be completed without an approved revegetation plan. Building elevations shall be revised to reflect grading modifications as applicable. 4b. Per the Ordinance definition of \"ground floor\", the ground level of the building shall be the floor whose finished floor elevation is closest to the grade of the adjacent street. Pursuant to UDO 6.12.1, please revise building height calculations to include the ground floor. // A re-review will be necessary upon receipt of your reply. Please note: Applications are valid for six months, applications with no response or review activity for a period exceeding 6 months will be voided. The current turnaro     if (el.dataset.pfield) { var pu = el.dataset.p, pf = el.dataset.pfield, val = el.value; wfApply(function (w) { w.permits[pu] = Object.assign({}, w.permits[pu] || {}); w.permits[pu][pf] = val; }, { action: "permit", target: pu, detail: pf + " → " + (pf === "owner" ? memberName(val) || "unassigned" : val || "none") }); return; }
    if (el.dataset.bulk) {
      var keys = Object.keys(SEL).filter(function (x) { return SEL[x] && C[x]; }), field = el.dataset.bulk, value = el.value === "__none" ? "" : el.value;
      if (!keys.length || (!el.value && field !== "due")) return;
      wfApply(function (w) { keys.forEach(function (k) { w.items[k] = Object.assign({ state: "open" }, w.items[k] || {}); w.items[k][field] = value; w.items[k].updated_at = isoNow(); w.items[k].updated_by = me(); }); },

    }
  });
  var ACTIONS = {
    cstate: function (el) { var cu = el.dataset.c, v = el.dataset.v; if (wstate(C[cu]) === v) return; setItem(cu, { state: v }, "status → " + WSTATE[v]).then(function () { toast(C[cu].dept + ": " + WSTATE[v]); }, function () {}); },
    opendrawer: function (el) { openDrawer(el.dataset.c); },
    markall: function (el) {

        { action: "permit", target: pu, detail: "status → " + (v ? STAGE[v] + " (manual)" : "automatic") }).then(function () { toast(v ? "Status set to " + STAGE[v] + "." : "Status is automatic again."); }, function () {});
    },
    closedrawer: function () { closeDrawer(); }, closemodal: closeModal, unlock: promptUnlock, reviewed: markReviewed, lock: lockWF,
    retrywf: function () { loadWF().then(render); }, menu: function () { $(".nav").classList.toggle("open"); },
    clearsel: function () { SEL = {}; render(); },
    csv: function () {
      var r = route(), rows = DATA.permits.filter(function (x) { return (!r.params.stage || x.stage === r.params.stage) && (!r.params.j || x.jurisdiction === r.params.j) && (!r.params.prop || x.property === r.params.prop) && textMatch(r.params.q, [x.number, x.type, x.property, x.status].join(" ")); });

      var csv = lines.map(function (l) { return l.map(function (v) { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n");
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "permits-" + todayISO() + ".csv"; a.click();
    },
    copyfixes: function (el) {
      var p = P[el.dataset.p], lines = [p.property + " (" + (p.address || "") + ") — " + p.type + " #" + p.number, "City status: " + p.status, ""];

        lines.push(c.dept + " (" + c.reviewer_status + "):");
        if (c.ai && c.ai.fixes.length) c.ai.fixes.forEach(function (f) { lines.push("  - " + f.text); }); else lines.push("  " + c.text);
        lines.push("");
      });
      lines.push("Portal: " + p.url);
      copy(lines.join("\n")).then(function () { toast("Fix list copied. Paste it into your email."); });
    },
    saveview: function (el) { promptText("Save view", "Name this view", function (name) { var k = "bp_views_" + el.dataset.view, v = LS.get(k, []); v.push({ name: name, hash: location.hash.replace(/[?&]c=[^&]*/, "") }); LS.set(k, v); render(); toast("View saved on this device."); }); },
    delviews: function (el) { var k = "bp_views_" + el.dataset.view, v = LS.get(k, []); modal("<h2>Saved views</h2>" + v.map(function (x, i) { return '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>' + esc(x.name) + '</span><button class="btn sm danger" data-act="delview" data-view="' + el.dataset.view + '" data-i="' + i + '">Delete</button></div>'; }).join("") + '<div class="row-btns"><button class="btn" data-act="closemodal">Done</button></div>', function () {}); },
    delview: function (el) { var k = "bp_views_" + el.dataset.view, v = LS.get(k, []); v.splice(+el.dataset.i, 1); LS.set(k, v); closeModal(); render(); },
    setupwf: function () {
      var a = $("#s-p1").value, b = $("#s-p2").value;

      if (a !== b) { toast("The two passphrases do not match."); return; }

        if (got) { toast("A workflow file already exists. Unlock it instead."); WF.status = "locked"; render(); return; }
        setPass(a, false); WF.status = "creating"; WF.data = emptyWF();
        return wfApply(function () {}, { action: "setup", target: "workflow", detail: "encrypted workflow created" }).then(function () { toast("Encrypted workflow created. Add your team below."); });
      }).catch(function (e) { WF.status = "none"; WF.data = null; toast(e.message); render(); });
    },
    addmember: function () {
      var name = $("#m-name").value.trim(); if (!name) { toast("Enter a name."); return; }
      var m = { id: "m" + Date.now().toString(36), name: name, email: $("#m-email").value.trim(), role: $("#m-role").value.trim() };
      wfApply(function (w) { w.team.push(m); }, { action: "team", target: m.id, detail: "added " + name }).then(function () { if (!LS.get("bp_me", "")) LS.set("bp_me", m.id); render(); }, function () {});
    },
    delmember: function (el) { var id = el.dataset.id, nm = memberName(id); if (!confirm("Remove " + nm + "? Comments they own will show as owned by a former member.")) return; wfApply(function (w) { w.team = w.team.filter(function (x) { return x.id !== id; }); }, { action: "team", target: id, detail: "removed " + nm }); },
    settoken: function () { promptToken(); }, forgettoken: function () { try { localStorage.removeItem("bp_gh_token"); } catch (e) {} render(); toast("Token forgotten on this device."); },
    changepass: function () {
      modal('<form><h2>Change passphrase</h2><p>Everyone will need the new passphrase. Update it on the Mac too (python3 permit_tracker.py --setup-secrets).</p><label class="f" for="c-p1">New passphrase</label><input type="password" id="c-p1" autocomplete="new-password"><label class="f" for="c-p2" style="margin-top:8px">Repeat</label><input type="password" id="c-p2" autocomplete="new-password"><div class="row-btns"><button type="button" class="btn" data-act="closemodal">Cancel</button><button class="btn primary">Change</button></div></form>', function () {

            .then(function (r) { if (!r.ok) throw new Error("GitHub " + r.status); setPass(a, !!LS.get("bp_wf_pass", null)); WF.data = x.w; toast("Passphrase changed."); render(); });
        }).catch(function (e) { toast("Not changed: " + e.message); });

    },
    addnote: function () { var cu = $("#drawer").dataset.cu, t = $("#d-note").value.trim(); if (!t) return; wfApply(function (w) { var it = w.items[cu] = Object.assign({ state: "open" }, w.items[cu] || {}); it.notes = (it.notes || []).concat([{ at: isoNow(), by: me(), text: t }]); it.updated_at = isoNow(); }, { action: "note", target: cu, detail: "note added" }).then(function () { openDrawer(cu, true); }, function () {}); },
    saveresp: function () { var cu = $("#drawer").dataset.cu; setItem(cu, { response: $("#d-resp").value }, "response recorded").then(function () { openDrawer(cu, true); }, function () {}); },

  }

  // keyboard
  var gPending = false;

    var tag = (document.activeElement || {}).tagName, typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (e.target.id === "q") {
      var links = $$("#results a");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sIdx = Math.max(0, Math.min(links.length - 1, sIdx + (e.key === "ArrowDown" ? 1 : -1))); links.forEach(function (l, i) { l.classList.toggle("on", i === sIdx); }); return; }
      if (e.key === "Enter" && links[sIdx]) { e.preventDefault(); go(links[sIdx].getAttribute("href")); $("#results").hidden = true; e.target.value = ""; e.target.blur(); return; }
